[project]
name = "whistle-dictate"
version = "0.1.0"
description = "Local voice dictation for Hyprland using Cactus Whistle (16.9 MB) — Hex-like, in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cactus-compute[mic]>=4.0",
  "numpy>=1.24",
  "sounddevice>=0.5",
  "soundfile>=0.12",
]

[project.scripts]
whistle-dictate = "whistle_dictate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whistle_dictate"]
